<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <style>
        /* Previous CSS remains the same */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #display {
            width: 100%;
            height: 60px;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: right;
            padding: 5px;
            background-color: #fff;
            border: none;
            border-radius: 5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #666;
            color: white;
        }

        button:hover {
            background-color: #999;
        }

        .operator {
            background-color: #ff9500;
        }

        .operator:hover {
            background-color: #ffaa33;
        }

        .clear {
            background-color: #ff3b30;
        }

        .clear:hover {
            background-color: #ff6961;
        }

        .special {
            background-color: #4a90e2;
        }

        .special:hover {
            background-color: #6fa8eb;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendToDisplay('%')">%</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>
            <button class="operator" onclick="appendToDisplay('*')">×</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="calculate()">=</button>
            <button onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="special" onclick="calculateGST(true)" style="grid-column: span 2;">GST+</button>
            <button class="special" onclick="calculateGST(false)" style="grid-column: span 2;">GST-</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendToDisplay(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                // Handle percentage calculations
                let expression = display.value.replace(/(\d+(\.\d+)?)%/g, '($1/100)');
                display.value = eval(expression);
            } catch (error) {
                display.value = 'Error';
            }
        }

        function calculateGST(isAdd) {
            try {
                const amount = parseFloat(display.value);
                if (isNaN(amount)) {
                    display.value = 'Error';
                    return;
                }

                const gstRate = parseFloat(prompt("Enter GST rate (%):"));
                if (isNaN(gstRate)) {
                    display.value = 'Invalid Rate';
                    return;
                }

                if (isAdd) {
                    // GST Add: amount * (1 + rate/100)
                    display.value = amount * (1 + gstRate/100);
                } else {
                    // GST Remove: amount / (1 + rate/100)
                    display.value = amount / (1 + gstRate/100);
                }
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
